[project]
name = "llm-inference-from-scratch"
version = "0.1.0"
description = "A Llama-3.2-1B inference engine written from scratch in C++/CUDA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "clang-format>=22.1.8",
    "ruff>=0.16.1",
]
